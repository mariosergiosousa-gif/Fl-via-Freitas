<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, follow" />
    <meta http-equiv="refresh" content="5;url=https://excelencia-em-odontologia.com.br/" />
    <title>Página Não Encontrada - Excelência em Odontologia</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
      :root {
        --brand-accent: #e88b67;
        --brand-paper: #050608;
      }
      
      body {
        background-color: var(--brand-paper);
        color: #f1f5f9;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        margin: 0;
        padding: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        text-align: center;
      }
      
      .container {
        max-width: 600px;
        padding: 40px 20px;
      }
      
      h1 {
        font-family: 'Playfair Display', Georgia, serif;
        font-size: 5rem;
        font-weight: 700;
        font-style: italic;
        color: var(--brand-accent);
        margin: 0 0 20px 0;
        line-height: 1;
      }
      
      h2 {
        font-family: 'Playfair Display', Georgia, serif;
        font-size: 2rem;
        font-weight: 500;
        margin: 0 0 20px 0;
        color: #ffffff;
      }
      
      p {
        font-size: 1rem;
        color: #94a3b8;
        line-height: 1.6;
        margin: 0 0 30px 0;
        font-weight: 300;
      }
      
      .button {
        display: inline-block;
        background-color: transparent;
        color: var(--brand-accent);
        border: 1px solid rgba(232, 139, 103, 0.3);
        padding: 12px 30px;
        font-size: 0.75rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.25em;
        text-decoration: none;
        transition: all 0.3s ease;
      }
      
      .button:hover {
        background-color: var(--brand-accent);
        color: var(--brand-paper);
        border-color: var(--brand-accent);
        box-shadow: 0 0 25px rgba(232, 139, 103, 0.2);
      }
      
      .countdown {
        font-size: 0.85rem;
        color: #64748b;
        margin-top: 25px;
      }
    </style>
  </head>
  <body>
    <div class="container" id="404-container">
      <h1 id="404-title">404</h1>
      <h2 id="404-subtitle">Página Não Encontrada</h2>
      <p id="404-text">Esta página já não existe, foi removida ou o endereço está incorreto. No novo website de <strong>Excelência em Odontologia</strong>, reunimos tudo em uma página principal moderna e intuitiva.</p>
      
      <a href="https://excelencia-em-odontologia.com.br/" class="button" id="404-home-btn">Ir para a Página Principal</a>
      
      <div class="countdown" id="404-countdown">
        Redirecionando automaticamente em <span id="seconds">5</span> segundos...
      </div>
    </div>
    
    <script>
      let seconds = 5;
      const secondsSpan = document.getElementById('seconds');
      const interval = setInterval(() => {
        seconds--;
        secondsSpan.textContent = seconds;
        if (seconds <= 0) {
          clearInterval(interval);
          window.location.href = "https://excelencia-em-odontologia.com.br/";
        }
      }, 1000);
    </script>
  </body>
</html>
